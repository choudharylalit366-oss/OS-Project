<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="730" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Producer–Consumer Conveyor System</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#475569">System architecture + minimal wiring (Arduino Uno)</text>

  <!-- ============ ARCHITECTURE STRIP ============ -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <rect x="40"  y="72" width="160" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="120" y="102">PRODUCER</text>
    <rect x="260" y="72" width="160" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="340" y="102">ENTRY SENSOR (D2)</text>
    <rect x="480" y="72" width="160" height="50" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="560" y="94">CONVEYOR</text>
    <text x="560" y="111" font-size="11" font-weight="normal">shared buffer (max 3)</text>
    <rect x="700" y="72" width="160" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="780" y="102">EXIT SENSOR (D3)</text>
    <rect x="820" y="72" width="0" height="0"/>
  </g>
  <rect x="880" y="72" width="80" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="920" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">CONSUMER</text>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="200" y1="97" x2="258" y2="97"/>
    <line x1="420" y1="97" x2="478" y2="97"/>
    <line x1="640" y1="97" x2="698" y2="97"/>
    <line x1="860" y1="97" x2="878" y2="97"/>
  </g>
  <rect x="150" y="138" width="700" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="500" y="158" text-anchor="middle" font-size="12.5" fill="#0f172a">Arduino Uno: reads D2 / D3 → updates <tspan font-weight="bold">count</tspan> (semaphore) → drives belt motor on D9 (PWM)</text>

  <line x1="40" y1="185" x2="960" y2="185" stroke="#cbd5e1"/>
  <text x="40" y="208" font-size="15" font-weight="bold" fill="#0f172a">WIRING DIAGRAM</text>

  <!-- ============ ARDUINO ============ -->
  <rect x="60" y="220" width="200" height="365" rx="10" fill="#0e7490" stroke="#164e63" stroke-width="2"/>
  <text x="160" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ARDUINO UNO</text>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#cffafe">(USB powers the board)</text>

  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="end">
    <text x="240" y="300">D2</text>
    <text x="240" y="380">D3</text>
    <text x="240" y="460">D9 (PWM)</text>
    <text x="240" y="520">5V</text>
    <text x="240" y="565">GND</text>
  </g>
  <g fill="#fde047" stroke="#713f12">
    <circle cx="260" cy="296" r="5"/>
    <circle cx="260" cy="376" r="5"/>
    <circle cx="260" cy="456" r="5"/>
    <circle cx="260" cy="516" r="5" fill="#ef4444"/>
    <circle cx="260" cy="561" r="5" fill="#111827"/>
  </g>

  <!-- ============ SENSORS ============ -->
  <rect x="480" y="245" width="210" height="95" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="585" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ENTRY SENSOR (IR module)</text>
  <text x="585" y="290" text-anchor="middle" font-size="12" fill="#0f172a">OUT → D2</text>
  <text x="585" y="308" text-anchor="middle" font-size="12" fill="#b91c1c">VCC → 5V</text>
  <text x="585" y="326" text-anchor="middle" font-size="12" fill="#111827">GND → GND</text>

  <rect x="480" y="355" width="210" height="95" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="585" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">EXIT SENSOR (IR module)</text>
  <text x="585" y="400" text-anchor="middle" font-size="12" fill="#0f172a">OUT → D3</text>
  <text x="585" y="418" text-anchor="middle" font-size="12" fill="#b91c1c">VCC → 5V</text>
  <text x="585" y="436" text-anchor="middle" font-size="12" fill="#111827">GND → GND</text>

  <!-- signal wires (blue) -->
  <polyline points="260,296 380,296 380,290 480,290" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="260,376 360,376 360,400 480,400" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="330" y="288" font-size="11" fill="#2563eb">signal</text>

  <!-- 5V / GND stubs -->
  <line x1="260" y1="516" x2="330" y2="516" stroke="#ef4444" stroke-width="3"/>
  <text x="336" y="520" font-size="11" fill="#b91c1c">5V → both sensors' VCC</text>
  <line x1="260" y1="561" x2="300" y2="561" stroke="#111827" stroke-width="3"/>
  <line x1="300" y1="561" x2="300" y2="610" stroke="#111827" stroke-width="3"/>

  <!-- ============ MOTOR DRIVER (NPN transistor) ============ -->
  <polyline points="260,456 330,456" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="330" y="446" width="60" height="20" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="360" y="440" text-anchor="middle" font-size="11" fill="#0f172a">1 kΩ</text>
  <polyline points="390,456 520,456 520,500 560,500" fill="none" stroke="#2563eb" stroke-width="3"/>

  <rect x="560" y="470" width="110" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="615" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">TIP120</text>
  <text x="615" y="522" text-anchor="middle" font-size="11" fill="#0f172a">(NPN driver)</text>
  <text x="566" y="494" font-size="10" fill="#0f172a">B</text>
  <text x="640" y="486" font-size="10" fill="#0f172a">C</text>
  <text x="640" y="554" font-size="10" fill="#0f172a">E</text>
  <circle cx="560" cy="500" r="4" fill="#fde047" stroke="#713f12"/>
  <circle cx="615" cy="470" r="4" fill="#fde047" stroke="#713f12"/>
  <circle cx="615" cy="560" r="4" fill="#fde047" stroke="#713f12"/>

  <!-- collector to motor -->
  <polyline points="615,470 615,425 750,425" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <!-- motor -->
  <circle cx="780" cy="425" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="423" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b21b6">M</text>
  <text x="780" y="440" text-anchor="middle" font-size="10" fill="#5b21b6">DC belt</text>
  <!-- motor to battery + -->
  <line x1="810" y1="425" x2="880" y2="425" stroke="#ef4444" stroke-width="3"/>
  <!-- flyback diode across motor -->
  <polyline points="750,425 750,385 810,385 810,425" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="765" y="376" width="30" height="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="780" y="372" text-anchor="middle" font-size="10" fill="#0f172a">1N4007 (stripe → +)</text>

  <!-- battery -->
  <rect x="880" y="395" width="80" height="80" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="920" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">9 V</text>
  <text x="920" y="446" text-anchor="middle" font-size="11" fill="#7f1d1d">motor supply</text>
  <text x="892" y="410" font-size="12" font-weight="bold" fill="#b91c1c">+</text>
  <text x="892" y="470" font-size="12" font-weight="bold" fill="#111827">−</text>
  <line x1="920" y1="475" x2="920" y2="610" stroke="#111827" stroke-width="3"/>

  <!-- common ground -->
  <polyline points="615,560 615,610" fill="none" stroke="#111827" stroke-width="3"/>
  <line x1="300" y1="610" x2="920" y2="610" stroke="#111827" stroke-width="3"/>
  <text x="610" y="628" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">COMMON GROUND (Arduino GND + TIP120 emitter + battery −)</text>

  <!-- ============ NOTES ============ -->
  <rect x="40" y="640" width="920" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="11.5" fill="#0f172a">
    <text x="52" y="658"><tspan font-weight="bold">TINKERCAD:</tspan> no IR obstacle module there → use a pushbutton per sensor: one leg to D2 (or D3), other leg to GND, plus a 10 kΩ pull-up from the pin to 5V.</text>
    <text x="52" y="675">Pressed = item detected (matches SENSOR_ACTIVE_LOW = true). Hold the EXIT button = item waiting; release it = consumer removed it.</text>
    <text x="52" y="692">Parts: Uno, 2 pushbuttons, 2×10 kΩ, 1 kΩ, TIP120 (or any NPN/NMOS), 1N4007, DC motor, 9 V battery. Motor power must be separate from the Uno's 5V.</text>
    <text x="52" y="709"><tspan font-weight="bold">L298N alternative:</tspan> D9 → ENA, IN1 → 5V, IN2 → GND, motor on OUT1/OUT2, battery on 12V pin, shared GND. (Replaces the transistor + diode.)</text>
  </g>
</svg>
